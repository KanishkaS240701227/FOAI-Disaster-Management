<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Chennai Relief Control</title>
    <meta name="description" content="Live flood, storm and earthquake risk for Chennai, with relief dispatch planning and delivery times." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315232E'/%3E%3Cpath d='M6 20c3-3 5 3 10 0s7 3 10 0v6H6z' fill='%23A9CDE8'/%3E%3Crect x='9' y='7' width='4' height='11' fill='%23fff'/%3E%3Crect x='15' y='11' width='4' height='7' fill='%23fff'/%3E%3Crect x='21' y='9' width='3' height='9' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      try {
        var t = localStorage.getItem('crc-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
